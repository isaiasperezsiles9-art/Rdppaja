      - name: Simpan sesi (persist-state.ps1)
        if: ${{ always() && !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/persist-state.ps1

      - name: Upload simpanan sesi
        if: ${{ always() && !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xyrdp-state
          path: C:\XyRDP\persist\xyrdp-state.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Finalize (matikan sesi + bersihkan status)
        if: ${{ always() && !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/finalize-rdp.ps1

      - name: Estafet sesi berikutnya (auto-renew tanpa mulai dari nol)
        if: ${{ success() && (inputs.perpanjang_otomatis || 'ya') != 'tidak' }}
        shell: pwsh
        continue-on-error: true
        run: |
          $hdr = @{
            Authorization          = "Bearer $($env:GITHUB_TOKEN)"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent'           = 'XyRDP-AutoRenew'
          }
          $body = @{
            ref    = 'main'
            inputs = @{
              durasi_menit        = "$($env:DUR)"
              hostname            = "$($env:HOSTNAME)"
              rdp_user            = "$($env:RDP_USER)"
              akses               = "$($env:AKSES)"
              storage_boost       = "$($env:STORAGE_BOOST)"
              debloat             = "$($env:DEBLOAT)"
              samp                = "$($env:SAMP)"
              samp_antiban        = "$($env:SAMP_ANTIBAN)"
              fps_boost           = "$($env:FPS_BOOST)"
              mumu                = "$($env:MUMU)"
              portmap_host        = "$($env:PORTMAP_HOST)"
              portmap_port        = "$($env:PORTMAP_PORT)"
              win10               = "$($env:WIN10)"
              xydesk              = "$($env:XYDESK)"
              ekstra              = "$($env:EKSTRA)"
              grafis              = "$($env:GRAFIS)"
              runner              = "${{ inputs.runner || 'windows-2022' }}"
              linux_mode          = "$($env:LINUX_MODE)"
              microphone          = "$($env:MICROPHONE)"
              roblox              = "$($env:ROBLOX)"
              minecraft_java      = "$($env:MINECRAFT_JAVA)"
              minecraft_bedrock   = "$($env:MINECRAFT_BEDROCK)"
              discord             = "$($env:DISCORD)"
              perpanjang_otomatis = "$($env:PERPANJANG_OTOMATIS)"
            }
          } | ConvertTo-Json -Depth 5
          try {
            # Anti-Suspend Guard untuk Akun Baru GitHub:
            # 1) Cek umur akun pemilik repo. Jika akun baru berumur < 7 hari, jangan lakukan
            #    self-retrigger tanpa henti karena sistem otomatis GitHub mendeteksinya sebagai bot loop.
            # 2) Beri jeda acak sopan (15-25 detik) sebelum memicu sesi estafet berikutnya.
            $ownerName = ($env:GITHUB_REPOSITORY -split '/')[0]
            $allowAutoRenew = $true
            try {
              $usrObj = Invoke-RestMethod -Uri "https://api.github.com/users/$ownerName" -Headers $hdr -TimeoutSec 15
              if ($usrObj -and $usrObj.created_at) {
                $ageDays = ([DateTime]::UtcNow - [DateTime]::Parse($usrObj.created_at).ToUniversalTime()).TotalDays
                if ($ageDays -lt 7) {
                  Write-Host "Anti-Suspend Guard: Akun @$ownerName masih berumur $([math]::Round($ageDays,1)) hari (< 7 hari). Auto-retrigger dilewati demi keamanan akun baru (silakan nyalakan sesi berikutnya secara manual dari aplikasi)."
                  $allowAutoRenew = $false
                }
              }
            } catch {}
            if ($allowAutoRenew) {
              Start-Sleep -Seconds (Get-Random -Minimum 15 -Maximum 26)
              Invoke-RestMethod -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/actions/workflows/rdp-6h.yml/dispatches" `
                -Headers $hdr -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 20 | Out-Null
              Write-Host 'Sesi berikutnya berhasil dijadwalkan otomatis (data sesi ini sudah tersimpan).'
            }
          } catch {
            Write-Host "Auto-renew dilewati: $($_.Exception.Message)"
          }
